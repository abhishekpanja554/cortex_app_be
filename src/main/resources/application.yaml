app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  jobs:
    internal-api-key: ${CORTEX_AI_API_KEY:}
    queue-key: jobs:embedding
    timeout-threshold: 5m
  logging:
    format: ${LOG_FORMAT:json}
    max-body-length: 10000
spring:
  application:
    name: cortex_app_be
  datasource:
    url: jdbc:postgresql://localhost:5432/cortex_app
    username: abhis
    password: ${DB_PASSWORD:}
  mvc:
    # GlobalExceptionHandler already logs these, avoids duplicates.
    log-resolved-exception: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,metrics